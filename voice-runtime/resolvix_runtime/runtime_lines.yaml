# Spoken line templates for runtime fallbacks, transfer results, and silence
fallback:
  hi: "Kshama kijiye, abhi hamare system mein takneeki samasya aa rahi hai. Kripya thodi der baad prayas karein."
  en: "We apologize, but our system is currently experiencing technical difficulties. Please call back shortly."
  hinglish: "Kshama kijiye, abhi technical issue ki wajah se dikkat aa rahi hai. Please thodi der baad try karein."

registered_no_id:
  hi: "Aapka anurodh darj kar liya gaya hai. Hamare staff jald hi aapse sampark karenge."
  en: "Your request has been registered. Our staff will contact you shortly."
  hinglish: "Aapka request register ho gaya hai. Hamari team aapse jald hi contact karegi."

transfer_failed:
  hi: "Staff abhi uplabdh nahi hain. Aapka request {ticket_id_spoken} khula hai, aapko jaldi contact kiya jayega."
  en: "Staff members are currently unavailable. Your ticket {ticket_id_spoken} remains open, and you will be contacted shortly."
  hinglish: "Staff abhi available nahi hain. Aapka ticket {ticket_id_spoken} create ho gaya hai aur hamari team aapse jald hi contact karegi."

transfer_simulated:
  hi: "Testing mode: Call transfer simulate kiya gaya hai."
  en: "Test mode: Call transfer has been simulated."
  hinglish: "Test mode: Call transfer simulate kar diya gaya hai."

goodbye:
  hi: "Helpline par call karne ke liye dhanyavad. Namaste."
  en: "Thank you for calling the college helpline. Goodbye."
  hinglish: "College helpline par call karne ke liye thank you. Have a good day!"

silence_1:
  hi: "Kya aap sun paa rahe hain? Kripya batayein main aapki kya madad karoon."
  en: "Are you still there? Please let me know how I may help you."
  hinglish: "Kya aap sun paa rahe hain? Please batayein main aapki kya help kar sakta hoon."

silence_2:
  hi: "Aapki aawaz nahi aa rahi hai. Kripya boliye ya baad mein call karein."
  en: "I cannot hear you. Please speak or feel free to call back."
  hinglish: "Aapki aawaz nahi aa rahi hai. Please boliye ya fir baad mein call karein."
