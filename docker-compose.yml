version: "3.8"

services:
  ops-api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY contracts/python /app/contracts/python
        RUN pip install --no-cache-dir -e /app/contracts/python fastapi uvicorn sqlalchemy pyyaml pydantic
        COPY . /app
        CMD ["python", "voice-runtime/dev/ops_stub.py"]
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      - SERVICE_KEY=change-me

  voice-runtime:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY contracts/python /app/contracts/python
        COPY voice-runtime /app/voice-runtime
        RUN pip install --no-cache-dir -e /app/contracts/python && pip install --no-cache-dir -e /app/voice-runtime
        CMD ["uvicorn", "resolvix_runtime.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPS_API_URL=http://ops-api:8100
      - SHIM_API_KEY=change-me
      - SERVICE_KEY=change-me
      - BRAIN_IMPL=mock
      - TELEPHONY_MODE=mock
    depends_on:
      - ops-api
